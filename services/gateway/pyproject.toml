# The gateway service package. Lists only the gateway's own runtime
# dependencies, so its container image can be built with
# `uv sync --package gateway --no-dev` and carry nothing from other services.

[project]
name = "gateway"
version = "0.1.0"
description = "Inference gateway: OpenAI-compatible API in front of a local model."
requires-python = ">=3.12"
# Lower bounds only. Exact versions are pinned in the workspace uv.lock.
dependencies = [
    "fastapi>=0.162.0",  # Still 0.x: minor releases may break; read the changelog when bumping.
    "uvicorn>=0.54.0",   # ASGI server that runs the app.
]

# uv's own build backend. It expects the src layout (src/gateway/__init__.py),
# which keeps the package importable only once installed, never by accident
# from the current directory. Pure-Python only; switch to hatchling if this
# service ever needs compiled extensions.
[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
