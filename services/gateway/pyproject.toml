[project]
name = "gateway"
version = "0.1.0"
description = "Inference gateway: OpenAI-compatible API in front of a local model."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
